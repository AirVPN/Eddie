name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 4 * * 3"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [csharp, cpp]

    steps:
      - uses: actions/checkout@v4

      # Needed for both matrix legs - the build step below always runs, since C++
      # analysis relies on it too (see comment on that step).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      # A single real build of the Linux CLI edition (same project as the Build workflow)
      # covers both matrix legs: the codeql-action/init tracer above wraps this command, so
      # it captures both the C# compilation (Lib.Core, Lib.Platform.Linux, App.CLI.Linux) and
      # the C++ compiler invocations that the postbuild scripts shell out to for the elevated
      # helper and native library. Both language passes need this step, not just csharp.
      - name: Build
        run: dotnet build src/App.CLI.Linux/App.CLI.Linux.net10.csproj --configuration Release

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
